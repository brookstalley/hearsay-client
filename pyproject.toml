[project]
name = "hearsay-client"
version = "0.1.0"
description = "Typed calls to a Hearsay service, with the startup handshake"
requires-python = ">=3.12"
# The client is built against the wire contract alone and imports nothing from the service, so it can move into
# 3tears once the calls stop changing (handoff #2). Its one dependency is the HTTP client.
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
